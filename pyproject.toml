[project]
name = "garmin-connect-mcp"
version = "1.0.0"
description = "Model Context Protocol server for Garmin Connect API integration"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=3.3.1",
    "garminconnect==0.3.6",
    "pydantic>=2.10.5",
    "pydantic-settings>=2.14.2",
    "python-dotenv>=1.0.1",
    "httpx>=0.28.1",
]

[project.scripts]
garmin-connect-mcp = "garmin_connect_mcp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = [
    "/LICENSE",
    "/README.md",
    "/pyproject.toml",
    "/src",
]

[tool.hatch.build.targets.wheel]
packages = ["src/garmin_connect_mcp"]

[dependency-groups]
dev = [
    "pip-audit==2.10.0",
    "pytest>=8.3.4",
    "pytest-asyncio>=0.25.2",
    "pytest-mock>=3.14.0",
    "pytest-cov>=6.0.0",
    "freezegun>=1.5.1",
    "ruff>=0.8.6",
    "pyright>=1.1.390",
]

[tool.uv]
constraint-dependencies = [
    "cryptography>=48.0.1",
    "joserfc>=1.6.8",
    "mcp>=1.28.1",
    "pyjwt>=2.13.0",
    "python-multipart>=0.0.31",
    "starlette>=1.3.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint]
select = ["E", "F", "B", "I", "UP"]
ignore = ["E501"]  # Line length enforced by ruff format instead

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # Allow unused imports in __init__.py files
"src/garmin_connect_mcp/server.py" = ["E402"]  # Imports must come after FastMCP initialization

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "basic"
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownArgumentType = false
reportUnknownVariableType = false
reportUnknownParameterType = false
reportMissingTypeArgument = false
reportArgumentType = false
reportMissingParameterType = false
